{{/* AWS-specific cilium Helm values*/}}
{{/* https://github.com/giantswarm/cilium-app/blob/main/helm/cilium/values.yaml*/}}
{{- define "awsCiliumHelmValues" }}
provider: capa
{{- $version := "N/A" }}
{{- if .Values.providerIntegration.useReleases }}
{{- $version = include "cluster.app.version" (merge (dict "appName" "cilium") $) | trim }}
{{- end }}
{{- /* Since v1.7.0, the API server URLs can be discovered automatically. */}}
{{- if or (eq $version "N/A") (semverCompare ">=1.7.0-0" $version) }}
k8s:
  apiServerURLs: auto
{{- end }}
{{- if eq .Values.global.connectivity.cilium.ipamMode "eni" }}
# https://docs.cilium.io/en/v1.14/network/concepts/routing/#id5
ipam:
  mode: eni
eni:
  enabled: true
  awsReleaseExcessIPs: true
enableIPv4Masquerade: false
routingMode: native
cluster:
    # Used by cilium to tag ENIs it creates and be able to filter and clean them up.
    name: {{ include "resource.default.name" $ | quote }}
cni:
  # Use https://github.com/giantswarm/cilium-app/blob/main/helm/cilium/templates/cilium-cni-configmap.yaml
  customConf: true
  configMap: cilium-cni-configuration
cniCustomConf:
  eni:
    firstInterfaceIndex: 1
    securityGroupTags:
      "kubernetes.io/cluster/{{ include "resource.default.name" $ }}": "owned"
      "sigs.k8s.io/cluster-api-provider-aws/association": "secondary"
    subnetTags:
      "sigs.k8s.io/cluster-api-provider-aws/cluster/{{ include "resource.default.name" $ }}": "owned"
      "sigs.k8s.io/cluster-api-provider-aws/association": "secondary"
      "sigs.k8s.io/cluster-api-provider-aws/role": "private"
extraEnv:
  - name: CNI_CONF_NAME
    value: "21-cilium.conflist"
{{- end }}
operator:
  tolerations:
  {{- include "cluster.internal.apps.cilium.operator.tolerations" $ | nindent 2 }}
  - key: ebs.csi.aws.com/agent-not-ready
    operator: Exists
  - key: karpenter.sh/unregistered
    operator: Exists
hubble:
  relay:
    tolerations:
    {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 4 }}
    - key: ebs.csi.aws.com/agent-not-ready
      operator: Exists
    - key: karpenter.sh/unregistered
      operator: Exists
  ui:
    tolerations:
    {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 4 }}
    - key: ebs.csi.aws.com/agent-not-ready
      operator: Exists
    - key: karpenter.sh/unregistered
      operator: Exists
certgen:
  tolerations:
  {{- include "cluster.internal.apps.cilium.tolerations" $ | nindent 2 }}
  - key: ebs.csi.aws.com/agent-not-ready
    operator: Exists
  - key: karpenter.sh/unregistered
    operator: Exists
{{- end }}
