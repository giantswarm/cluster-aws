global:
  managementCluster: test
  metadata:
    name: test-local-nvme
    organization: giantswarm
  connectivity:
    baseDomain: example.com
  nodePools:
    nvme0:
      instanceType: m6id.xlarge
      localNvme:
        enabled: true
      maxSize: 3
      minSize: 1
    plain0:
      instanceType: m6i.xlarge
      maxSize: 3
      minSize: 1
    nvmekarp0:
      type: karpenter
      localNvme:
        enabled: true
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - m6id
            - r6id
    karp0:
      type: karpenter
  providerSpecific:
    region: "eu-west-1"
  release:
    version: 29.1.0

cluster:
  internal:
    ephemeralConfiguration:
      offlineTesting:
        renderWithoutReleaseResource: true
