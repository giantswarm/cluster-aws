global:
  managementCluster: test
  metadata:
    name: test-instance-store
    organization: giantswarm
  connectivity:
    baseDomain: example.com
  nodePools:
    instancestore0:
      instanceType: m6id.xlarge
      kubeletVolume: instanceStore
      maxSize: 3
      minSize: 1
    plain0:
      instanceType: m6i.xlarge
      maxSize: 3
      minSize: 1
    instancestorekarp0:
      type: karpenter
      kubeletVolume: instanceStore
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - m6id
            - r6id
    karp0:
      type: karpenter
    instancestorekarp1:
      type: karpenter
      kubeletVolume: instanceStore
  providerSpecific:
    region: "eu-west-1"
  release:
    version: 29.1.0

cluster:
  internal:
    ephemeralConfiguration:
      offlineTesting:
        renderWithoutReleaseResource: true
